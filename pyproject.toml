[project]
name = "semg2pose"
version = "0.1.0"
description = "Compact pose representations for generalizable sEMG-to-pose decoding (built on emg2pose)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # emg2pose and its bundled UmeTrack, installed from the git submodule (see tool.uv.sources).
    # emg2pose's setup.py declares no dependencies, so its runtime deps are listed here.
    "emg2pose",
    "UmeTrack",
    "torch==2.3.1",
    "pytorch-lightning==2.2.2",
    # Lightning 2.2 imports pkg_resources, supplied by setuptools before version 81.
    "setuptools<81",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "h5py==3.11.0",
    "unidecode==1.3.8",
    "pandas==2.2.2",
    "pyyaml==6.0.1",
    "click==8.1.7",
    "trio==0.25.1",
    "hydra-core==1.3.2",
    "plotly==5.24.1",
    "av==13.1.0",
    "opencv-python==4.10.0.84",
    "pillow==11.0.0",
    "kaleido==0.2.1",
    "matplotlib==3.9.2",
    "mediapy==1.2.2",
    "joblib==1.4.2",
    "nbformat==5.10.4",
    "tqdm>=4.66,<5",
    # Dimensionality reduction (versions compatible with numpy 1.26).
    "scikit-learn==1.5.2",
    "umap-learn==0.5.7",
    "numba==0.60.0",
]

[project.optional-dependencies]
# Pick one: `uv sync --extra cpu` (no GPU) or `uv sync --extra cu121` (NVIDIA GPU).
# With neither, torch comes from PyPI (CUDA build on Linux).
cpu = ["torch==2.3.1"]
cu121 = ["torch==2.3.1"]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "nbconvert>=7,<8",
    "pytest==8.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semg2pose"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu121" }]]

[tool.uv.sources]
emg2pose = { path = "emg2pose", editable = true }
umetrack = { path = "emg2pose/emg2pose/UmeTrack", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu121", extra = "cu121", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
